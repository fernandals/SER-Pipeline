title: SER-RAVDESS-WavLM-(agg-${model.layer_aggregation})-(pool-${model.pooling_strategy})-(freeze-${model.freeze_backbone})-(loss-${loss.name})-(prior-${loss.use_weighted_loss})-(epochs-${trainer.max_epochs})-(bs-${train.batch_size})-(lr-${optimizer.params.learning_rate})

# Weights & Biases
use_wandb: false
wandb_project: "SER-Audio"
wandb_entity: proga150-ufrn

seed: 42

datasets:
    train:
        metadata_path: "/home/fernanda/home/SER/SER-Pipeline/data/ravdess/train.csv"
        audio_base_dir: "/home/fernanda/home/SER/RAVDESS"
        filename_column: "FileName"
        target_column: "EmoClass"

    val:
        metadata_path: "/home/fernanda/home/SER/SER-Pipeline/data/ravdess/dev.csv"
        audio_base_dir: "/home/fernanda/home/SER/RAVDESS"
        filename_column: "FileName"
        target_column: "EmoClass"

data:
    num_classes: 8
    target_sr: 16000
    max_duration: 6.0  # RAVDESS clips are <= 5.3 s, so nothing is actually truncated

    label2id:
        Angry: 0
        Calm: 1
        Disgust: 2
        Fear: 3
        Happy: 4
        Neutral: 5
        Sad: 6
        Surprise: 7

loss:
    name: "ce"
    use_weighted_loss: true
    label_smoothing: 0.0

# Tuned for a laptop RTX 3050 (6 GB VRAM), 12 CPU cores, 7 GB system RAM.
train:
    batch_size: 4       # what fits in 6 GB VRAM with wavlm-base-plus + bf16
    shuffle: true
    num_workers: 3      # 3 audio-loading processes; higher risks OOM on 7 GB RAM

model:
    model_type: "audio"

    #model_name: "microsoft/wavlm-large"
    model_name: "microsoft/wavlm-base-plus"
    freeze_backbone: true
    layer_aggregation: "weighted_sum"  # "last" or "weighted_sum" (learned softmax over layers)
    pooling_strategy: "mean"            # "mean" (masked) or "attpool"

    mlp_hidden_dim: 1024
    mlp_num_layers: 1
    mlp_dropout: 0.1
    mlp_activation_func: "relu"

optimizer:
    name: "adamw"
    params:
        learning_rate: 1e-4
        min_learning_rate: 1e-6
        eps: 1e-8
        weight_decay: 1e-6
        betas: [0.9, 0.98]

scheduler:
    name: "cosinewarmuplr"
    params:
        warmup_ratio: 0.05

tags:
    - ravdess
    - ${model.model_name}
    - ${train.batch_size}-BS
    - LR-${optimizer.params.learning_rate}

trainer:
    accelerator: "gpu"
    precision: "bf16-mixed"     # RTX 3050 (Ampere) supports bf16; ~halves VRAM use
    max_epochs: 40
    num_sanity_val_steps: 2
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    gradient_clip_algorithm: "norm"
    val_check_interval: 1.0
    accumulate_grad_batches: 2  # 4 (batch) x 2 = effective batch size 8

model_checkpoint:
    mode: "max"
    monitor: "val_f1"  # slash-free alias of val/f1-score (see pl_wrapper._log_epoch_metrics)
    save_last: true
    save_top_k: 1
    save_weights_only: true
    filename: "{epoch:02d}-{val_f1:.4f}"

# Stop once val macro-F1 hasn't improved for `patience` validations.
# Comment this block out to always train the full max_epochs.
early_stopping:
    monitor: "val_f1"
    mode: "max"
    patience: 5
    min_delta: 0.001
    verbose: true
