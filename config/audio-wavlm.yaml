title: SER-Audio-WavLM-(agg-${model.layer_aggregation})-(pool-${model.pooling_strategy})-(freeze-${model.freeze_backbone})-(loss-${loss.name})-(prior-${loss.use_weighted_loss})-(epochs-${trainer.max_epochs})-(bs-${train.batch_size})-(lr-${optimizer.params.learning_rate})

# Weights & Biases (optional). Set use_wandb: false to log only to CSV/stdout.
use_wandb: false
wandb_project: "SER-Audio"
wandb_entity: null

seed: 42

datasets:
    train:
        metadata_path: "data/train.csv"
        audio_base_dir: "data/audio"
        filename_column: "FileName"
        target_column: "EmoClass"

    val:
        metadata_path: "data/dev.csv"
        audio_base_dir: "data/audio"
        filename_column: "FileName"
        target_column: "EmoClass"

data:
    num_classes: 8
    target_sr: 16000
    max_duration: 15.0  # seconds; longer clips are center-truncated

    # label2id must match the strings in the target column of the metadata CSV
    label2id:
        A: 0  # Anger
        C: 1  # Contempt
        D: 2  # Disgust
        F: 3  # Fear
        H: 4  # Happiness
        N: 5  # Neutral
        S: 6  # Sadness
        U: 7  # Surprise

loss:
    name: "ce"
    use_weighted_loss: true  # inverse-frequency class weights from the train split
    label_smoothing: 0.0

train:
    batch_size: 8
    shuffle: true
    num_workers: 8

model:
    model_type: "audio"

    model_name: "microsoft/wavlm-large"
    freeze_backbone: true
    layer_aggregation: "weighted_sum"  # "last" or "weighted_sum" (learned softmax over layers)
    pooling_strategy: "mean"            # "mean" (masked) or "attpool"

    mlp_hidden_dim: 1024
    mlp_num_layers: 1
    mlp_dropout: 0.1
    mlp_activation_func: "relu"

optimizer:
    name: "adamw"
    params:
        learning_rate: 1e-4
        min_learning_rate: 1e-6
        eps: 1e-8
        weight_decay: 1e-6
        betas: [0.9, 0.98]

scheduler:
    name: "cosinewarmuplr"
    params:
        warmup_ratio: 0.05

tags:
    - ${model.model_name}
    - ${train.batch_size}-BS
    - LR-${optimizer.params.learning_rate}

trainer:
    accelerator: "gpu"
    max_epochs: 20
    num_sanity_val_steps: 2
    log_every_n_steps: 10
    gradient_clip_val: 10.0
    gradient_clip_algorithm: "norm"
    val_check_interval: 1.0
    accumulate_grad_batches: 1

model_checkpoint:
    mode: "max"
    monitor: "val_f1"  # slash-free alias of val/f1-score (see pl_wrapper._log_epoch_metrics)
    save_last: true
    save_top_k: 1
    save_weights_only: true
    filename: "{epoch:02d}-{val_f1:.4f}"

# Stop once val macro-F1 hasn't improved for `patience` validations.
# Comment this block out to always train the full max_epochs.
early_stopping:
    monitor: "val_f1"
    mode: "max"
    patience: 5
    min_delta: 0.001
    verbose: true
