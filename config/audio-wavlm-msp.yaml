# Paths are relative to the repository root. Absolute paths also work.
msp:
    metadata: data/msp_podcast/msp_podcast_complete.csv
    audio_dir: data/msp_podcast/Audios
    splits_dir: data/msp_splits

seed: 42
title: msp-wavlm-frozen-s${seed}
checkpoint_dir: checkpoints
log_dir: lightning_logs

datasets:
    train:
        metadata_path: ${msp.splits_dir}/train.csv
        audio_base_dir: ${msp.audio_dir}
        filename_column: FileName
        target_column: EmoClass
    val:
        metadata_path: ${msp.splits_dir}/dev.csv
        audio_base_dir: ${msp.audio_dir}
        filename_column: ${datasets.train.filename_column}
        target_column: ${datasets.train.target_column}
    test:
        metadata_path: ${msp.splits_dir}/test.csv
        audio_base_dir: ${msp.audio_dir}
        filename_column: ${datasets.train.filename_column}
        target_column: ${datasets.train.target_column}

test:
    batch_size: ${train.batch_size}
    num_workers: ${train.num_workers}
    output_dir: results/${title}/test
    # Missing from the local copy of Test1.
    exclude_files: [MSP-PODCAST_1909_1017.wav]

data:
    num_classes: 8
    target_sr: 16000
    max_duration: 15.0
    label2id: {A: 0, C: 1, D: 2, F: 3, H: 4, N: 5, S: 6, U: 7}

model:
    model_type: audio
    model_name: microsoft/wavlm-base-plus
    freeze_backbone: true
    layer_aggregation: weighted_sum
    pooling_strategy: mean
    mlp_hidden_dim: 1024
    mlp_num_layers: 1
    mlp_dropout: 0.1
    mlp_activation_func: relu

train:
    batch_size: 4
    shuffle: true
    num_workers: 3

loss:
    name: ce
    use_weighted_loss: true
    label_smoothing: 0.0

optimizer:
    name: adamw
    params:
        learning_rate: 1e-4
        min_learning_rate: 1e-6
        eps: 1e-8
        weight_decay: 1e-6
        betas: [0.9, 0.98]

scheduler:
    name: cosinewarmuplr
    params:
        warmup_ratio: 0.05

trainer:
    accelerator: gpu
    devices: [0]
    precision: bf16-mixed
    deterministic: true
    max_epochs: 20
    accumulate_grad_batches: 2
    num_sanity_val_steps: 2
    log_every_n_steps: 10
    gradient_clip_val: 10.0

model_checkpoint:
    mode: max
    monitor: val_f1
    save_last: true
    save_top_k: 1
    save_weights_only: true
    filename: "{epoch:02d}-{val_f1:.4f}"

early_stopping:
    monitor: val_f1
    mode: max
    patience: 5
    min_delta: 0.001
